<!-- FILE PATH: public/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
  <title>ZenvoX AI — Multimodal AI & 10-Step STEM Solve Platform</title>
  <link rel="stylesheet" href="/css/style.css" />
  <!-- KaTeX, Highlight.js, Marked, and DOMPurify CDNs -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/styles/atom-one-dark.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/highlight.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script defer src="/js/app.js"></script>
</head>
<body>
  <div class="app-layout">
    <div id="mobileBackdrop" class="mobile-backdrop"></div>

    <!-- SIDEBAR NAVIGATION & HISTORY -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="brand-logo">
          <span class="brand-badge">Z</span>
          <span>ZenvoX AI</span>
        </div>
        <button id="closeSidebarBtn" class="icon-btn-sm" title="Close Menu">✕</button>
      </div>

      <button id="newChatBtn" class="btn-new-chat">＋ New Conversation</button>

      <div class="sidebar-search">
        <input id="searchConvInput" type="search" placeholder="Search chat history..." />
      </div>

      <div id="convList" class="conv-list"></div>

      <div class="sidebar-footer">
        <div style="display:flex;justify-content:space-between;">
          <span>Daily Token Usage</span>
          <span id="usageLabel">0 / 500k</span>
        </div>
        <div class="usage-bar-wrap">
          <div id="usageBarFill" class="usage-bar-fill"></div>
        </div>
        <div style="display:flex;justify-content:space-between;gap:6px;margin-top:4px;">
          <button id="exportChatBtn" class="msg-action-btn" style="flex:1;">Export .MD</button>
          <button id="clearHistoryBtn" class="msg-action-btn" style="flex:1;color:var(--state-error);">Clear All</button>
        </div>
      </div>
    </aside>

    <!-- MAIN WORKSPACE -->
    <main class="main-area">
      <header class="top-navbar">
        <div class="nav-left">
          <button id="toggleSidebarBtn" class="icon-btn" title="Toggle Sidebar">☰</button>
          <div class="mode-tabs" role="tablist">
            <button class="mode-tab active" data-mode="chat">Chat</button>
            <button class="mode-tab" data-mode="study">Study Mode</button>
            <button class="mode-tab" data-mode="solve">Solve Mode</button>
            <button class="mode-tab" data-mode="image">Image Gen</button>
            <button class="mode-tab" data-mode="video">Video Gen</button>
          </div>
        </div>

        <div class="nav-right">
          <label class="quick-chip" style="display:inline-flex;align-items:center;gap:5px;cursor:pointer;" title="Enable Offline Bengali + English OCR on images">
            <input type="checkbox" id="ocrToggleCheckbox" style="accent-color:var(--accent-cyan);" />
            <span>OCR (বাং/EN)</span>
          </label>
          <select id="voiceLangSelect" class="study-select" title="Voice Input Language">
            <option value="bn-BD">🎤 বাংলা</option>
            <option value="en-US">🎤 EN</option>
          </select>
          <button id="adminDashBtn" class="icon-btn" style="display:none;border-color:var(--accent-secondary);color:var(--accent-secondary);" title="Admin Dashboard">📊</button>
          <button id="authOpenBtn" class="icon-btn" title="Account / Sign In">👤</button>
          <button id="themeToggleBtn" class="icon-btn" title="Toggle Dark/Light Theme">◐</button>
        </div>
      </header>

      <!-- STUDY & SOLVE CONTEXT BAR -->
      <section id="studyToolbar" class="study-toolbar">
        <select id="eduLevelSelect" class="study-select">
          <option value="Class 9-10 (SSC)">Class 9-10 (SSC)</option>
          <option value="Class 11-12 (HSC)" selected>Class 11-12 (HSC)</option>
          <option value="BSc Honours / University">BSc Honours / University</option>
        </select>
        <select id="subjectSelect" class="study-select">
          <option value="Physics">Physics (পদার্থবিজ্ঞান)</option>
          <option value="Chemistry">Chemistry (রসায়ন)</option>
          <option value="Mathematics">Mathematics (গণিত)</option>
          <option value="Biology">Biology (জীববিজ্ঞান)</option>
          <option value="ICT & CS">ICT & Computer Science</option>
          <option value="English & Bengali">English & Bengali</option>
        </select>
        <button class="quick-chip" data-quick="Explain this concept simply with real-world examples.">Explain Simply</button>
        <button class="quick-chip" data-quick="Generate 5 exam-oriented MCQs with answer explanations.">Generate MCQs</button>
        <button class="quick-chip" data-quick="Solve this numerical problem step-by-step using the 10-step method.">10-Step Solve</button>
        <button class="quick-chip" data-quick="সহজ ও নির্ভুল বাংলায় ব্যাখ্যা করো।">বাংলায় ব্যাখ্যা</button>
      </section>

      <!-- CHAT STREAM VIEWPORT -->
      <section id="chatViewport" class="chat-viewport"></section>

      <!-- FIXED BOTTOM COMPOSER -->
      <footer class="composer-dock">
        <div class="composer-inner">
          <div id="attachmentTray" class="attachment-tray"></div>

          <div class="composer-bar">
            <input id="fileInput" type="file" multiple accept=".jpg,.jpeg,.png,.webp,.pdf,.txt,.md,.docx,.csv,.xlsx,.json,.js,.py,.html,.css" hidden />
            <button id="attachBtn" class="icon-btn" title="Attach Images, PDFs, DOCX, XLSX, or Code">📎</button>
            <button id="voiceInputBtn" class="icon-btn voice-btn" title="Voice Input (Speech-to-Text)">🎤</button>
            <textarea id="composerInput" class="composer-textarea" rows="1" placeholder="Ask ZenvoX AI, upload a diagram/PDF, or solve a physics/math problem..."></textarea>
            <button id="stopBtn" class="btn-stop">■ Stop</button>
            <button id="sendBtn" class="btn-send">Send ➤</button>
          </div>

          <div class="composer-meta-row">
            <div style="display:flex;align-items:center;gap:8px;">
              <span class="status-dot"></span>
              <select id="modelSelect" class="model-select"></select>
            </div>
            <span id="statusBanner">Ready • Secure Multi-Provider Routing</span>
          </div>
        </div>
      </footer>
    </main>
  </div>

  <!-- AUTHENTICATION MODAL -->
  <div id="authModal" class="modal-overlay" style="display:none;">
    <div class="modal-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <h3 id="authModalTitle">ZenvoX AI Account</h3>
        <button id="closeAuthModal" class="icon-btn-sm">✕</button>
      </div>
      <div id="authUserView" style="display:none;">
        <p style="margin-bottom:8px;color:var(--text-secondary);">Signed in as <strong id="authUserName" style="color:var(--text-primary);"></strong></p>
        <p style="margin-bottom:16px;font-size:0.82rem;color:var(--accent-secondary);" id="authUserRole"></p>
        <button id="logoutBtn" class="btn-new-chat" style="width:100%;margin:0;background:var(--state-error);">Sign Out</button>
      </div>
      <form id="authForm">
        <input id="authNameInput" type="text" placeholder="Full Name" class="modal-input" style="display:none;" />
        <input id="authEmailInput" type="email" placeholder="Email Address" class="modal-input" required />
        <input id="authPassInput" type="password" placeholder="Password (6+ chars)" class="modal-input" required />
        <div id="authErrorMsg" style="color:var(--state-error);font-size:0.82rem;margin-bottom:8px;"></div>
        <button type="submit" id="authSubmitBtn" class="btn-new-chat" style="width:100%;margin:0 0 10px 0;">Sign In</button>
        <div style="text-align:center;font-size:0.82rem;color:var(--text-secondary);">
          <span id="authSwitchPrompt">Need an account?</span>
          <button type="button" id="authSwitchBtn" style="background:none;border:none;color:var(--accent-primary);font-weight:700;cursor:pointer;">Register</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ADMIN ANALYTICS MODAL -->
  <div id="adminModal" class="modal-overlay" style="display:none;">
    <div class="modal-card" style="max-width:580px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <h3>📊 Admin Usage & Cost Metrics</h3>
        <button id="closeAdminModal" class="icon-btn-sm">✕</button>
      </div>
      <div id="adminMetricsBody" style="font-size:0.88rem;max-height:65vh;overflow-y:auto;">Loading...</div>
    </div>
  </div>
</body>
</html>
